; Vorlage fuer Samples\configuration.ini
;
; Die echte configuration.ini enthaelt Zugangsdaten und ist deshalb von der
; Versionsverwaltung ausgenommen. Diese Datei kopieren, umbenennen und die
; Werte des jeweiligen Lieferanten eintragen. Die Endpunkte und Zugangsdaten
; vergibt der Lieferant, sie stehen nicht in der Spezifikation.
;
; Je Lieferant eine Section. Der Section-Name ist frei waehlbar und dient als
; Verbindungsname.
;
; Welche Felder ein Lieferant erwartet, steht in der Tabelle in der README.

[Beispiel Lieferant mit Passwort-Flow]
; grant_type=password, der haeufigste Fall
GrantType=password
Username=
Password=
Customernumber=
ClientID=
ClientSecret=
ClientScope=openMasterdata
; pipedelimited sendet alle Datenpakete in einem Parameter,
; exploded je Paket einen eigenen
DataPackageSendMode=pipedelimited
UsernameRequired=True
CustomernumberRequired=False
ClientSecretRequired=False
OAuthURL=https://beispiel.lieferant.de/oauth2/token
BySupplierPIDURL=https://beispiel.lieferant.de/openmasterdata/product/bySupplierPID
ByManufacturerDataURL=
ByGTINURL=
; Artikelnummern zum Ausprobieren, durch Komma getrennt.
; LoginTest verwendet die erste davon.
ArtNoAsCommatext=

[Beispiel Lieferant mit Client-Credentials-Flow]
; Achtung: Manche Lieferanten fuehren client_credentials und erwarten
; trotzdem Username und Password. Beides eintragen, wenn der Lieferant es
; verlangt, die Bibliothek sendet die Felder dann mit.
GrantType=client_credentials
Username=
Password=
Customernumber=
ClientID=
ClientSecret=
ClientScope=
DataPackageSendMode=pipedelimited
UsernameRequired=True
CustomernumberRequired=False
ClientSecretRequired=True
OAuthURL=https://beispiel.lieferant.de/authentication/getAuthToken
BySupplierPIDURL=https://beispiel.lieferant.de/product/bySupplierPID
ByManufacturerDataURL=
ByGTINURL=
ArtNoAsCommatext=
